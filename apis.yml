aid: third-arc-bio
name: Third Arc Bio
description: >-
  Third Arc Bio is a clinical-stage biotechnology company headquartered in Lower Gwynedd,
  Pennsylvania, developing multifunctional antibodies that build immune synapses to precisely
  activate or inhibit T cells. Its ARCStim platform targets solid tumors and its ARCTag platform
  pursues tissue-specific precision immune regulation for immunology and inflammation (I&I)
  indications; lead program ARC101 is a bispecific T-cell engager in a Phase 1 trial in patients
  with CLDN6-expressing solid tumors. The company launched in 2022 with seed financing from Omega
  Funds, raised an oversubscribed $165M Series A, and closed a $52M Series A extension in February
  2026 with Andreessen Horowitz joining the syndicate. Third Arc Bio publishes no public API,
  developer portal, SDK or machine-readable specification — it is a therapeutics developer, not a
  software vendor.
